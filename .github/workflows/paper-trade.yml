
name: SwingPilot Paper Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '47 23 * * 1-5'

permissions:
  contents: write

concurrency:
  group: swingpilot-paper
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run paper trading simulation
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python bot/trader.py
      - name: Save simulated portfolio
        run: |
          if ! git diff --quiet -- docs/data/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/state.json
            git commit -m "Update paper trading portfolio"
            git push
          fi
