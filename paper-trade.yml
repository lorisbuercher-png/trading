name: SwingPilot Paper Trading (no real money)
on:
  workflow_dispatch:
  schedule:
    - cron: '47 23 * * 1-5'
permissions:
  contents: write
concurrency:
  group: swingpilot-paper
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulate daily paper orders (not connected to broker)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python bot/trader.py
      - name: Persist paper portfolio snapshots
        run: |
          if ! git diff --quiet -- docs/data/state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data/state.json
            git commit -m "chore: update simulated portfolio"
            git push
          fi
